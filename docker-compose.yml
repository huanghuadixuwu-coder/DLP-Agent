name: leetcode-rag-agent-enterprise

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      API_BASE_URL: http://api:8000
    ports:
      - "8010:8000"
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      - .:/app
      - ./external-models:/app/external-models

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "
      celery -A app.task_queue.celery_app worker --loglevel=INFO --queues=dlp_risk_queue --concurrency=$${RISK_WORKER_CONCURRENCY:-4} &
      celery -A app.task_queue.celery_app worker --loglevel=INFO --queues=email_send_queue --concurrency=$${EMAIL_WORKER_CONCURRENCY:-2} &
      celery -A app.task_queue.celery_app worker --loglevel=INFO --queues=mail_inbound_queue --concurrency=$${MAIL_WORKER_CONCURRENCY:-1} &
      celery -A app.task_queue.celery_app worker --loglevel=INFO --queues=enterprise_rag_queue --concurrency=$${ENTERPRISE_WORKER_CONCURRENCY:-1} &
      celery -A app.task_queue.celery_app worker --loglevel=INFO --queues=meeting_queue --concurrency=$${MEETING_WORKER_CONCURRENCY:-1} &
      wait
      "
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      API_BASE_URL: http://api:8000
    depends_on:
      - postgres
      - redis
      - chroma
    volumes:
      - .:/app
      - ./external-models:/app/external-models

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run web/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8511:8501"
    depends_on:
      - api
    volumes:
      - .:/app
      - ./external-models:/app/external-models

  governance-web:
    image: leetcode-rag-agent-enterprise-web
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run web/governance_console.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8512:8501"
    depends_on:
      - api
    volumes:
      - .:/app
      - ./external-models:/app/external-models

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dlp_agent
      POSTGRES_USER: dlp_agent
      POSTGRES_PASSWORD: dlp_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:1.0.15
    ports:
      - "8011:8000"
    volumes:
      - chroma_data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - api

volumes:
  chroma_data:
  postgres_data:
  prometheus_data:
  redis_data:
